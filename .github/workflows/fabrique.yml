# Fabrication de nuit, PC éteint : voix sur Kaggle (GPU gratuit), rendu Remotion, miniature, dépôt dans le stock.
# Lancement à la main pour l'instant (chaque nuit à 01 h 30 UTC une fois la planification activée) ; à la main : Actions > Fabrique > Run workflow.
# « À blanc » (par défaut à la main) : liste ce qui serait fabriqué, sans rien lancer.
name: Fabrique
on:
  schedule:
    - cron: "30 1 * * *"   # 01 h 30 UTC = 02 h 30 à Paris en hiver : la fabrication de nuit
  workflow_dispatch:
    inputs:
      a_blanc:
        description: "À blanc (ne fabrique rien)"
        type: boolean
        default: true
      id:
        description: "Épisode précis (vide = le prochain à fabriquer)"
        default: ""

permissions:
  contents: write
  actions: write
concurrency:
  group: fabrique
  cancel-in-progress: false

jobs:
  fabrique:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BDF_VOIX: kaggle
      BDF_CONCURRENCY: "2"
      STOCKAGE: github
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONIOENCODING: utf-8
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}      # facultatif : banque de vidéos libres (clé gratuite)
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}    # facultatif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installation
        run: |
          mkdir -p autopilot/state
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci --silent
          npx remotion browser ensure > /dev/null
          bash tools/fetch-audio.sh
          pip install -q kaggle six
      - name: Musiques de fond (jeu Kaggle privé, facultatif)
        run: |
          kaggle datasets download -d "$KAGGLE_USERNAME/bdf-musique" -p autopilot/musique --unzip || echo "pas de jeu de musiques : les vidéos sortent sans musique"
          ls autopilot/musique | grep -v LISEZ-MOI || true
      - name: Fabrication (voix Kaggle + rendu)
        id: fab
        run: |
          echo "avant=$(python autopilot/cloud/restant.py)" >> "$GITHUB_OUTPUT"
          opts="--max 12 --budget-min 290"
          [ -n "${{ inputs.id }}" ] && opts="--max 1 --id ${{ inputs.id }}"
          [ "${{ github.event_name == 'workflow_dispatch' && inputs.a_blanc }}" = "true" ] && opts="$opts --dry-run"
          python autopilot/run_daily.py fabriquer $opts
      - name: Miniature et contrôle
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.a_blanc) }}
        run: python autopilot/run_daily.py finaliser
      - name: Dépôt dans le stock
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.a_blanc) }}
        run: python autopilot/cloud/deposer.py
      - name: Instantané pour l'interface web
        if: always()
        run: |
          python autopilot/run_daily.py etat --json > /dev/null || true
          mkdir -p live
          npx tsx tools/autopilot-snapshot.ts --out=live/snapshot.json
      - name: Enregistrement de l'état et de l'instantané
        if: always()
        run: |
          git config user.name "bdf-fabrique"
          git config user.email "bdf-fabrique@users.noreply.github.com"
          git add live
          # à blanc : seul l'instantané de l'interface est enregistré
          [ "${{ github.event_name == 'workflow_dispatch' && inputs.a_blanc }}" = "true" ] || git add episodes-b
          bash autopilot/cloud/enregistrer.sh "Fabrique : état des épisodes ($(date -u +%F))"
      - name: Enchaîner s'il reste des épisodes à fabriquer
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.a_blanc) && inputs.id == '' }}
        run: |
          apres=$(python autopilot/cloud/restant.py)
          echo "à fabriquer : avant=${{ steps.fab.outputs.avant }} après=$apres"
          # on relance seulement si cette exécution a fait avancer les choses (évite de tourner en boucle sur une panne)
          if [ "$apres" -gt 0 ] && [ "$apres" -lt "${{ steps.fab.outputs.avant }}" ]; then
            gh workflow run fabrique.yml --repo "$GH_REPO" -f a_blanc=false
            echo "nouvelle fabrication lancée"
          fi
      - name: Journal
        if: always()
        run: tail -n 60 autopilot/logs/*.log 2>/dev/null || true
